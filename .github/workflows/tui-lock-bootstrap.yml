# Temporary branch-scoped bootstrap; removed before merging the PR.
name: Bootstrap Bun lockfile (temporary)
on:
  push:
    branches:
      - chore/reproducible-opentui-lockfile-20261014
    paths:
      - .github/workflows/tui-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'bei-shan/WodeAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Generate Bun text lockfile with the same Bun as TUI CI
        working-directory: tui-v2
        run: |
          bun install --lockfile-only
          test -s bun.lock
      - name: Commit only the generated Bun lockfile to the feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tui-v2/bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(tui): lock Bun 1.4.2 dependency resolution"
          git push origin HEAD:refs/heads/chore/reproducible-opentui-lockfile-20261014
