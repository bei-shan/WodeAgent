name: Web MVP checks

on:
  push:
    branches: [main, feat/local-web-auth-20261013]
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/runtime/**'
      - 'core/events.py'
      - 'tests/test_web_service.py'
      - 'tests/test_retired_tui_boundary.py'
      - 'tests/test_application_services.py'
      - 'tests/test_application_settings.py'
      - 'tests/test_config_catalog.py'
      - 'tests/test_workspace_service.py'
      - 'tests/test_session_config_isolation.py'
      - 'tests/test_background_config_propagation.py'
      - 'core/background_task.py'
      - 'core/team_engine/**'
      - 'tests/test_team_checkpoint_service.py'
      - 'tests/test_team_session_persistence.py'
      - 'tests/test_team_parallel_session_restore.py'
      - 'tests/test_team_approval_persistence.py'
      - 'tests/test_tool_runtime_pipeline.py'
      - 'tests/test_agent_loop_ports.py'
      - 'tests/test_model_gateway_ports.py'
      - 'tests/test_agent_snapshot_builder.py'
      - 'tests/test_agent_turn_lifecycle.py'
      - 'core/runtime/model_gateway.py'
      - 'core/runtime/agent_loop.py'
      - 'core/runtime/context_runtime.py'
      - 'core/runtime/config_scope.py'
      - 'tests/test_web_interrupt.py'
      - 'tests/test_event_journal.py'
      - 'tests/test_turn_lifecycle.py'
      - 'tests/test_llm_recovery.py'
      - 'core/sandbox/**'
      - 'tools/registry.py'
      - 'tests/test_sandbox_boundary.py'
      - 'desktop/service/local_auth.py'
      - 'desktop/web/src/AuthGate.tsx'
      - 'tests/test_local_web_auth.py'
      - 'tests/test_sandbox_docker_integration.py'
      - 'core/context_engine/**'
      - 'core/config.py'
      - 'prompts/agents_prompts/summary_prompt.py'
      - 'tests/test_context_continuity.py'
      - 'tests/test_context_engineering.py'
      - 'tests/test_history_manager.py'
      - 'tests/test_summary_compressor.py'
      - 'core/llm.py'
      - 'core/llm_recovery.py'
      - 'agents/codeAgent.py'
      - 'requirements.txt'
      - '.github/workflows/web-mvp.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      - run: npm run build
        working-directory: desktop/web
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m pytest tests/test_mcp_sdk_compat.py tests/test_retired_tui_boundary.py tests/test_turn_lifecycle.py tests/test_llm_recovery.py tests/test_event_journal.py tests/test_web_service.py tests/test_application_services.py tests/test_application_settings.py tests/test_config_catalog.py tests/test_workspace_service.py tests/test_session_config_isolation.py tests/test_background_config_propagation.py tests/test_tool_runtime_pipeline.py tests/test_tool_input_contracts.py tests/test_tool_scheduler.py tests/test_step_tool_batches.py tests/test_trace_sanitizer_security.py tests/test_agent_loop_ports.py tests/test_model_gateway_ports.py tests/test_agent_snapshot_builder.py tests/test_agent_turn_lifecycle.py tests/test_team_checkpoint_service.py tests/test_team_session_persistence.py tests/test_team_parallel_session_restore.py tests/test_team_approval_persistence.py tests/test_observation_truncator.py tests/test_web_interrupt.py tests/test_session_manager.py tests/test_session_tree.py tests/test_llm_streaming.py tests/test_e2e_agent.py tests/test_turn_executor.py tests/test_context_continuity.py tests/test_history_manager.py tests/test_context_engineering.py tests/test_summary_compressor.py tests/test_context_builder.py tests/test_bash_tool.py tests/test_tool_bootstrap.py tests/test_sandbox_boundary.py tests/test_local_web_auth.py -q

  python-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      # Include every Python test, not just the curated API smoke list.
      # Live Docker isolation has a separate opt-in job below.
      - run: python -m pip check
      - run: python -m pytest tests/ -q

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      # Run UI regressions with a mocked local agent transport; no API key required.
      - run: npm install --no-save @playwright/test@1.58.2
        working-directory: desktop/web
      - run: npx playwright install --with-deps chromium
        working-directory: desktop/web
      - run: npx playwright test
        working-directory: desktop/web

  docker-sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      # The Agent never pulls images. A trusted runner preloads an image for
      # this live (non-mocked) sandbox integration test.
      - run: docker pull python:3.12-alpine
      - run: python -m pytest tests/test_sandbox_docker_integration.py -q
        env:
          AGENT_DOCKER_INTEGRATION: '1'
