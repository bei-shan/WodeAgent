name: Web MVP checks

on:
  push:
    branches: [main, feat/context-engineering-deerflow-20261013]
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/runtime/**'
      - 'core/events.py'
      - 'tests/test_web_service.py'
      - 'tests/test_web_interrupt.py'
      - 'tests/test_event_journal.py'
      - 'tests/test_turn_lifecycle.py'
      - 'tests/test_llm_recovery.py'
      - 'core/context_engine/**'
      - 'core/config.py'
      - 'prompts/agents_prompts/summary_prompt.py'
      - 'tests/test_context_continuity.py'
      - 'tests/test_context_engineering.py'
      - 'tests/test_history_manager.py'
      - 'tests/test_summary_compressor.py'
      - 'core/llm.py'
      - 'core/llm_recovery.py'
      - 'agents/codeAgent.py'
      - 'requirements.txt'
      - '.github/workflows/web-mvp.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      - run: npm run build
        working-directory: desktop/web
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m pytest tests/test_turn_lifecycle.py tests/test_llm_recovery.py tests/test_event_journal.py tests/test_web_service.py tests/test_web_interrupt.py tests/test_session_manager.py tests/test_session_tree.py tests/test_llm_streaming.py tests/test_e2e_agent.py tests/test_turn_executor.py tests/test_context_continuity.py tests/test_history_manager.py tests/test_context_engineering.py tests/test_summary_compressor.py tests/test_context_builder.py -q

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      # Run UI regressions with a mocked local agent transport; no API key required.
      - run: npm install --no-save @playwright/test@1.58.2
        working-directory: desktop/web
      - run: npx playwright install --with-deps chromium
        working-directory: desktop/web
      - run: npx playwright test
        working-directory: desktop/web
