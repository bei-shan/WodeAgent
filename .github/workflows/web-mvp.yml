name: Web MVP checks

on:
  push:
    branches: [main, feat/web-stable-mvp-20261013]
  pull_request:
    paths:
      - 'desktop/**'
      - 'core/runtime/**'
      - 'core/events.py'
      - 'tests/test_web_service.py'
      - 'requirements.txt'
      - '.github/workflows/web-mvp.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - run: npm ci
        working-directory: desktop/web
      - run: npm run build
        working-directory: desktop/web
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m pytest tests/test_web_service.py -q
