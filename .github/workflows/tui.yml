name: TUI

on:
  push:
    branches: [main]
    paths:
      - "tui/**"
      - "desktop/service/**"
      - "core/runtime/**"
      - "core/events.py"
      - "core/session_manager.py"
      - "core/context_engine/history_manager.py"
      - "requirements.txt"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "tui/**"
      - "desktop/service/**"
      - "core/runtime/**"
      - "core/events.py"
      - "core/session_manager.py"
      - "core/context_engine/history_manager.py"
      - "requirements.txt"
      - ".github/workflows/tui.yml"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: git diff --exit-code -- bun.lock
      - run: bun run typecheck
      - run: bun test
      - run: python3 test/pty_smoke.py
