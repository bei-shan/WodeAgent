name: Distributed turn capacity (Redis)
on:
  pull_request:
    paths:
      - "core/runtime/distributed_admission.py"
      - "tests/test_redis_turn_admission.py"
      - ".github/workflows/redis-turn-capacity.yml"
  push:
    branches: [main]
    paths:
      - "core/runtime/distributed_admission.py"
      - "tests/test_redis_turn_admission.py"
      - ".github/workflows/redis-turn-capacity.yml"

permissions:
  contents: read

jobs:
  redis-atomic-leases:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=6
    env:
      RIDGE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "redis>=5,<7"
      - run: python -m pytest tests/test_redis_turn_admission.py -q
