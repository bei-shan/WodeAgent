name: Documentation integrity

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs.yml"

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_links.py
