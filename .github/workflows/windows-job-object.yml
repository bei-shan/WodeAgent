name: Windows process ownership

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows-job-object:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows Job Object timeout kills descendants
        shell: pwsh
        run: python tests/native/windows_job_smoke.py
