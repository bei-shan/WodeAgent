name: PostgreSQL tenant session isolation

on:
  pull_request:
    paths:
      - "core/persistence/**"
      - "desktop/service/hosted_app.py"
      - "desktop/service/hosted_identity.py"
      - "docs/releases/production-gates.md"
      - "tests/test_hosted_identity_api.py"
      - "requirements-hosted.txt"
      - "db/migrations/**"
      - "tests/test_postgres_private_sessions.py"
      - "tests/test_postgres_turn_queue.py"
      - "requirements-postgres.txt"
      - ".github/workflows/postgres-tenant-store.yml"
  push:
    branches: [main]
    paths:
      - "core/persistence/**"
      - "desktop/service/hosted_app.py"
      - "desktop/service/hosted_identity.py"
      - "tests/test_hosted_identity_api.py"
      - "tests/test_postgres_turn_queue.py"
      - "requirements-hosted.txt"
      - "docs/releases/production-gates.md"
      - "db/migrations/**"
      - "tests/test_postgres_private_sessions.py"
      - "requirements-postgres.txt"
      - ".github/workflows/postgres-tenant-store.yml"

permissions:
  contents: read

jobs:
  postgres-private-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_admin
          POSTGRES_DB: ridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ridge_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGPASSWORD: ci_only_admin
      RIDGE_TEST_POSTGRES_DSN: postgresql://ridge_app:ci_only_runtime@127.0.0.1:5432/ridge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime test dependencies
        run: python -m pip install -r requirements.txt -r requirements-hosted.txt pytest
      - name: Prepare least-privileged DB account and migration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -f db/migrations/0001_tenant_private_sessions.sql
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -f db/migrations/0002_private_turn_jobs.sql
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE ridge_app LOGIN PASSWORD 'ci_only_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA ridge TO ridge_app"
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ridge.private_sessions TO ridge_app"
          psql -h 127.0.0.1 -U postgres -d ridge_ci \
            -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ridge.private_turn_jobs TO ridge_app"
      - name: Run real PostgreSQL owner isolation and CAS tests
        run: python -m pytest tests/test_postgres_private_sessions.py tests/test_postgres_turn_queue.py tests/test_hosted_identity_api.py -q
